<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />

<title>Admin Login - Lisa Spa</title>
<script>
  const admin = sessionStorage.getItem('adminUser');

  if (admin) {
    // Already logged in → redirect to dashboard
    window.location.replace('dashboard.html');
  }
</script>


<style>
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #F8C8DC, #a35a87);
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
  }

  .login-container {
    background: #fff;
    padding: 35px 25px;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    width: 100%;
    max-width: 400px;
  }

  .login-container h2 {
    text-align: center;
    margin-bottom: 20px;
    color: #800080;
  }

  .login-container label {
    display: block;
    margin: 10px 0 5px;
    font-weight: 600;
  }

  .login-container input {
    width: 100%;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 8px;
    outline: none;
    font-size: 15px;
    transition: border 0.2s;
  }

  .login-container input:focus {
    border-color: #742e51;
  }

  .login-container button {
    width: 100%;
    padding: 10px;
    margin-top: 20px;
    background: #FF10F0;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
  }

  .login-container button:hover {
    background: #8d3a63;
  }

  .error {
    color: red;
    text-align: center;
    margin-top: 10px;
    display: none;
  }
</style>
</head>
<body>
  <div class="login-container">
    <h2>Admin Login</h2>
    <label>Email</label>
    <input type="email" id="adminEmail" placeholder="Enter email">

    <label>Password</label>
    <input type="password" id="adminPassword" placeholder="Enter password">

    <button id="loginBtn">Login</button>
    <p id="errorMsg" class="error">Invalid email or password</p>
  </div>

  <script type="module">
    // Import Firebase
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

    // Firebase config
    const firebaseConfig = {
        apiKey: "AIzaSyCx3I1FRYpOPi2ponH88fapPZFK0TUX3xk",
        authDomain: "lisaartistryspa-761ac.firebaseapp.com",
        projectId: "lisaartistryspa-761ac",
        storageBucket: "lisaartistryspa-761ac.firebasestorage.app",
        messagingSenderId: "974775812115",
        appId: "1:974775812115:web:ba03bce66cf7eb147f3fe6"
    };
    
    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const loginBtn = document.getElementById('loginBtn');
    const emailInput = document.getElementById('adminEmail');
    const passwordInput = document.getElementById('adminPassword');
    const errorMsg = document.getElementById('errorMsg');

    loginBtn.addEventListener('click', async () => {
      const email = emailInput.value.trim();
      const password = passwordInput.value.trim();

      if (!email || !password) {
        errorMsg.textContent = 'Please enter your email and password.';
        errorMsg.style.display = 'block';
        return;
      }

      try {
        const userCredential = await signInWithEmailAndPassword(auth, email, password);
        sessionStorage.setItem('adminUser', JSON.stringify(userCredential.user));
        window.location.href = 'dashboard.html'; // Redirect to dashboard
      } catch (error) {
        console.error(error);
        errorMsg.textContent = 'Invalid email or password.';
        errorMsg.style.display = 'block';
      }
    });
  </script>
</body>
</html>
