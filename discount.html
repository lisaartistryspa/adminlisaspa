<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Dashboard – Lisa Spa</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
<script>
  const admin = sessionStorage.getItem('adminUser');

  if (!admin) {
    // If not logged in, redirect immediately
    window.location.replace('index.html');
  }
</script>
<style>
/* RESET & BASE */
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;}
body{display:flex;min-height:100vh;background:#f6f9fc;color:#1a202c;overflow-x:hidden;}

/* SIDEBAR */
.sidebar{
  width:240px;background-color:#d38edb;color:white;
  display:flex;flex-direction:column;padding:20px;
  position:fixed;top:0;left:0;height:100%;
  z-index:200;transition:transform .3s ease,box-shadow .3s ease;
  box-shadow:2px 0 8px rgba(0,0,0,0.1);
}
.sidebar h2{text-align:center;margin-bottom:-30px;font-size:1.5rem;}
.sidebar a{color:white;padding:10px 15px;margin:5px 0;border-radius:8px;text-decoration:none;display:block;transition:.3s;}
.sidebar a:hover{background:rgba(255,255,255,0.2);}
.sidebar a.active{background:rgba(255,255,255,0.25);}

/* MAIN CONTENT */
.main{flex:1;margin-left:240px;padding:25px;transition:margin-left .3s ease;}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;}
.header h3{color:#FF69B4;font-size:1.6rem;flex:1;}
.hamburger{display:none;font-size:1.8rem;background:none;border:none;color:#FF69B4;cursor:pointer;transition:transform .3s;}
.hamburger:hover{transform:scale(1.1);}

/* FORM + LIST */
.container{max-width:700px;background:white;padding:25px;border-radius:10px;box-shadow:0 4px 10px rgba(0,0,0,0.1);}
.container h4{color:#9c27b0;margin-bottom:15px;}
label{display:block;margin-top:12px;font-weight:600;}
input,select{width:100%;padding:8px;margin-top:4px;border:1px solid #ccc;border-radius:6px;}
input:focus,select:focus{border-color:#9c27b0;outline:none;}
button{margin-top:18px;background: #d38edb;color:#fff;border:none;padding:10px 18px;border-radius:8px;cursor:pointer;transition:.3s;}
.btnvouch:hover{background:#9c27b0;}
.voucher-list{margin-top:25px;}
.voucher-item{background:#fafafa;border:1px solid #ddd;padding:12px;border-radius:6px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;}
.voucher-item span{font-size:14px;}
.actions button{margin-left:8px;padding:6px 12px;border:none;border-radius:5px;cursor:pointer;}
.edit-btn{background:#7ccfed;color:#fff;}
.del-btn{background:#AA336A;color:#fff;}
.edit-btn:hover{background:#3ab9e7;}
.del-btn:hover{background:#6e0b39;}

/* RESPONSIVE */
@media (max-width:992px){
  .main{margin-left:0;padding:20px;}
  .sidebar{transform:translateX(-100%);position:fixed;box-shadow:none;}
  .sidebar.active{transform:translateX(0);box-shadow:2px 0 10px rgba(0,0,0,0.2);}
  .hamburger{display:block;}
  .header{position:sticky;top:0;background:#f6f9fc;z-index:150;padding:10px 0;}
  body.sidebar-open{overflow:hidden;}
}
</style>
</head>
<body>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">
  <h2><img src="lisawhite.png" alt="logo" width="auto" height="150px"/></h2>
  <a href="dashboard.html"><i class="bi bi-bar-chart-line"></i> Dashboard</a>
  <a href="allbookings.html"><i class="bi bi-bookmarks"></i> Bookings</a>
  <a href="customers.html"><i class="bi bi-people-fill"></i> Customers</a>
  <a href="services.html"><i class="bi bi-briefcase"></i> Manage Services</a>
  <a href="reviews.html"><i class="bi bi-star"></i> Customer Reviews</a>
  <a href="discount.html" class="active"><i class="bi bi-gift"></i> Discounts</a>
  <button class="logoutBtn" id="logoutBtn" style="background:#854385;color:#fff;padding:8px 16px;border:none;border-radius:6px;cursor:pointer;">
    <i class="bi bi-arrow-left-short"></i>Logout
  </button>
</div>

<!-- MAIN -->
<div class="main">
  <div class="header">
    <button class="hamburger" id="menuBtn">☰</button>
    <h3><i class="bi bi-gift"></i> Gifts & Discounts</h3>
  </div>

  <div class="container">
    <h4>Manage Vouchers</h4>
    <form id="voucherForm">
      <input type="hidden" id="voucherId">
      <label>Voucher Code</label>
      <input type="text" id="code" placeholder="e.g. WELCOME10" required>
      <label>Type</label>
      <select id="type" required>
        <option value="">Select Type</option>
        <option value="percent">Percent</option>
        <option value="amount">Amount</option>
      </select>
      <label>Value</label>
      <input type="number" id="value" placeholder="e.g. 10" required>
      <label>Expiry Date</label>
      <input type="date" id="expiry" required>
      <label>Active</label>
      <select id="active">
        <option value="true">True</option>
        <option value="false">False</option>
      </select>
      <button type="submit" class="btnvouch">Save Voucher</button>
    </form>

    <div class="voucher-list" id="voucherList"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, updateDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

// 🔥 Firebase Config
const firebaseConfig = {
  apiKey: "AIzaSyCx3I1FRYpOPi2ponH88fapPZFK0TUX3xk",
  authDomain: "lisaartistryspa-761ac.firebaseapp.com",
  projectId: "lisaartistryspa-761ac",
  storageBucket: "lisaartistryspa-761ac.firebasestorage.app",
  messagingSenderId: "974775812115",
  appId: "1:974775812115:web:ba03bce66cf7eb147f3fe6"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const voucherRef = collection(db, "vouchers");

// Sidebar toggle
const menuBtn = document.getElementById('menuBtn');
const sidebar = document.getElementById('sidebar');
menuBtn.addEventListener('click',()=>{
  sidebar.classList.toggle('active');
  document.body.classList.toggle('sidebar-open');
});
document.querySelectorAll('.sidebar a').forEach(link=>{
  link.addEventListener('click',()=>{
    if(window.innerWidth<=992){
      sidebar.classList.remove('active');
      document.body.classList.remove('sidebar-open');
    }
  });
});

// Elements
const voucherForm = document.getElementById("voucherForm");
const voucherList = document.getElementById("voucherList");
const voucherIdField = document.getElementById("voucherId");

async function loadVouchers(){
  voucherList.innerHTML="<p>Loading vouchers...</p>";
  const snapshot = await getDocs(voucherRef);
  voucherList.innerHTML="";
  snapshot.forEach(docSnap=>{
    const data = docSnap.data();
    const div=document.createElement("div");
    div.className="voucher-item";
    div.innerHTML=`
      <span><b>${data.code}</b> — ${data.type} (${data.value}) | Exp: ${data.expiry} | Active: ${data.active}</span>
      <div class="actions">
        <button class="edit-btn" data-id="${docSnap.id}" data-data='${JSON.stringify(data)}'>Edit</button>
        <button class="del-btn" data-id="${docSnap.id}">Delete</button>
      </div>
    `;
    voucherList.appendChild(div);
  });

  document.querySelectorAll(".edit-btn").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const id=btn.dataset.id;
      const data=JSON.parse(btn.dataset.data);
      voucherIdField.value=id;
      document.getElementById("code").value=data.code;
      document.getElementById("type").value=data.type;
      document.getElementById("value").value=data.value;
      document.getElementById("expiry").value=data.expiry;
      document.getElementById("active").value=data.active?"true":"false";
      window.scrollTo({top:0,behavior:'smooth'});
    });
  });

  document.querySelectorAll(".del-btn").forEach(btn=>{
    btn.addEventListener("click",async()=>{
      if(confirm("Are you sure you want to delete this voucher?")){
        await deleteDoc(doc(db,"vouchers",btn.dataset.id));
        alert("Voucher deleted!");
        loadVouchers();
      }
    });
  });
}

// Handle submit
voucherForm.addEventListener("submit",async(e)=>{
  e.preventDefault();
  const voucherData={
    code:document.getElementById("code").value.trim(),
    type:document.getElementById("type").value,
    value:Number(document.getElementById("value").value),
    expiry:document.getElementById("expiry").value,
    active:document.getElementById("active").value==="true"
  };
  const id=voucherIdField.value;
  try{
    if(id){
      await updateDoc(doc(db,"vouchers",id),voucherData);
      alert("Voucher updated successfully!");
    }else{
      await addDoc(voucherRef,voucherData);
      alert("Voucher created successfully!");
    }
    voucherForm.reset();
    voucherIdField.value="";
    loadVouchers();
  }catch(err){
    alert("Error saving voucher: "+err.message);
  }
});

// Initial load
loadVouchers();

logoutBtn.addEventListener('click', () => {
  // Clear sessionStorage
  sessionStorage.removeItem('adminUser');

  // Redirect to login page
  window.location.replace('index.html');
});
</script>

</body>
</html>
