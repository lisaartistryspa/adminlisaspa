<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Dashboard – NextEdge Spa</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* RESET & BASE STYLES */
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
body { display: flex; min-height: 100vh; background: #f6f9fc; color: #1a202c; overflow-x: hidden; }

/* SIDEBAR */
.sidebar {
  width: 240px; background-color: #FF69B4; color: white;
  display: flex; flex-direction: column; padding: 20px;
  position: fixed; top: 0; left: 0; height: 100%;
  z-index: 200; transition: transform 0.3s ease, box-shadow 0.3s ease;
  box-shadow: 2px 0 8px rgba(0,0,0,0.1);
}
.sidebar h2 { text-align: center; margin-bottom: 30px; font-size: 1.5rem; }
.sidebar a { color: white; padding: 10px 15px; margin: 5px 0; border-radius: 8px; text-decoration: none; display: block; transition: 0.3s; }
.sidebar a:hover { background: rgba(255,255,255,0.2); }
.sidebar a.active { background: rgba(255,255,255,0.25); }

/* MAIN CONTENT */
.main { flex: 1; margin-left: 240px; padding: 25px; transition: margin-left 0.3s ease; }
@media(max-width: 992px){
  .main { flex: 1; width: 90%; margin-left: 5%; padding: 25px; transition: margin-left 0.3s ease; }
}
.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; }
.header h1 { color: #FF69B4; font-size: 1.6rem; flex: 1; }

/* HAMBURGER BUTTON */
.hamburger { display: none; font-size: 1.8rem; background: none; border: none; color: #FF69B4; cursor: pointer; transition: transform 0.3s; }
.hamburger:hover { transform: scale(1.1); }

/* FORM */
form {
  background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05);
  margin-bottom: 25px; max-width: 650px; width: 100%;
}
form label { display: block; margin: 10px 0 5px; font-weight: 600; color: #2d3748; }
form input, form select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #cbd5e0; font-size: 1rem; outline: none; transition: border-color 0.2s; }
form input:focus, form select:focus { border-color: #FF69B4; }
form button { margin-top: 15px; padding: 12px 18px; border: none; border-radius: 8px; background: #FF69B4; color: white; cursor: pointer; font-weight: bold; transition: background 0.3s; width: 100%; }
form button:hover { background: #FF00FF; }
#formStatus { margin-top: 8px; font-weight: bold; text-align: center; }

/* TABLE */
.table-container { background: #fff; padding: 15px; border-radius: 12px; overflow-x: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
table { width: 100%; border-collapse: collapse; min-width: 600px; }
th, td { padding: 10px; text-align: left; border-bottom: 1px solid #e2e8f0; }
th { background: #FF69B4; color: white; white-space: nowrap; }
tr:hover { background: #e6f0ff; }
.action-btn { padding: 6px 10px; margin: 0 2px; border: none; border-radius: 5px; cursor: pointer; font-size: 0.85rem; }
.edit { background: #f7f0f3; color: white; }
.delete { background: #eccadb; color: white; }

/* PAGINATION */
#pagination { margin-top: 15px; display: flex; justify-content: flex-end; gap: 10px; }
#pagination button { padding: 6px 12px; border-radius: 5px; border: 1px solid #ccc; background: #fff; cursor: pointer; }
#pagination button:disabled { opacity: 0.5; cursor: not-allowed; }

/* RESPONSIVE DESIGN */
@media (max-width: 992px) {
  .main { margin-left: 0; padding: 20px; }
  .sidebar { transform: translateX(-100%); position: fixed; box-shadow: none; }
  .sidebar.active { transform: translateX(0); box-shadow: 2px 0 10px rgba(0,0,0,0.2); }
  .hamburger { display: block; }
  .header { position: sticky; top: 0; background: #f6f9fc; z-index: 150; padding: 10px 0; }
  body.sidebar-open { overflow: hidden; }
}
</style>
</head>
<body>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">
  <h2>Lisa Spa</h2>
  <a href="index.html">Dashboard</a>
  <a href="allbookings.html">Bookings</a>
  <a href="customers.html">Customers</a>
  <a href="services.html" class="active">Manage Services</a>
  <a href="reviews.html">Customer Reviews</a>
  <a href="#">Settings</a>
</div>

<!-- MAIN CONTENT -->
<div class="main">
  <div class="header">
    <button class="hamburger" id="menuBtn">☰</button>
    <h1>Manage Services</h1>
  </div>

  <!-- FORM -->
  <form id="serviceForm">
    <input type="hidden" id="serviceId">
    <label>Mode</label>
    <select id="serviceMode" required>
      <option value="">--Select Mode--</option>
      <option value="inSpa">In Spa</option>
      <option value="homeService">Home Service</option>
    </select>

    <label>Type</label>
    <select id="serviceType" required>
      <option value="">--Select Type--</option>
      <option value="Massage">Massage</option>
      <option value="Body Scrubs">Body Scrubs</option>
      <option value="Facials">Facials</option>
      <option value="Nails">Pedicure</option>
      <option value="Nails">Waxing</option>
      <option value="Nails">Lash Extension</option>
    </select>

    <label>Service Name</label>
    <input type="text" id="serviceName" required>
    <label>Price (₦)</label>
    <input type="number" id="servicePrice" min="0" required>

    <button type="submit">Save Service</button>
    <p id="formStatus"></p>
  </form>

  <label for="modeFilter">Filter by Mode:</label>
  <select id="modeFilter">
    <option value="all">All</option>
    <option value="inSpa">In Spa</option>
    <option value="homeService">Home Service</option>
  </select>

  <!-- TABLE -->
  <div class="table-container">
    <table id="servicesTable">
      <thead>
        <tr>
          <th>Mode</th>
          <th>Type</th>
          <th>Service</th>
          <th>Price (₦)</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- PAGINATION -->
  <div id="pagination">
    <button id="prevPage" disabled>Previous</button>
    <span id="pageInfo">Page 1</span>
    <button id="nextPage">Next</button>
  </div>

</div>

<!-- JS SCRIPT -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, updateDoc, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCx3I1FRYpOPi2ponH88fapPZFK0TUX3xk",
  authDomain: "lisaartistryspa-761ac.firebaseapp.com",
  projectId: "lisaartistryspa-761ac",
  storageBucket: "lisaartistryspa-761ac.firebasestorage.app",
  messagingSenderId: "974775812115",
  appId: "1:974775812115:web:ba03bce66cf7eb147f3fe6"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const serviceForm = document.getElementById('serviceForm');
const servicesTable = document.querySelector('#servicesTable tbody');
const formStatus = document.getElementById('formStatus');
const modeFilter = document.getElementById('modeFilter');

const menuBtn = document.getElementById('menuBtn');
const sidebar = document.getElementById('sidebar');
menuBtn.addEventListener('click', () => { sidebar.classList.toggle('active'); document.body.classList.toggle('sidebar-open'); });
document.querySelectorAll('.sidebar a').forEach(link => {
  link.addEventListener('click', () => {
    if (window.innerWidth <= 992) { sidebar.classList.remove('active'); document.body.classList.remove('sidebar-open'); }
  });
});

// PAGINATION SETUP
const pageSize = 5;
let currentPage = 1;
let servicesData = [];

const prevPageBtn = document.getElementById('prevPage');
const nextPageBtn = document.getElementById('nextPage');
const pageInfo = document.getElementById('pageInfo');

function renderServices(snapshot) {
  const filter = modeFilter.value;
  servicesData = snapshot.docs
    .map(docSnap => ({ id: docSnap.id, ...docSnap.data() }))
    .filter(s => filter === 'all' || s.mode === filter);

  const totalPages = Math.ceil(servicesData.length / pageSize);
  if (currentPage > totalPages) currentPage = totalPages || 1;

  const start = (currentPage - 1) * pageSize;
  const end = start + pageSize;
  const pageData = servicesData.slice(start, end);

  servicesTable.innerHTML = '';
  pageData.forEach(s => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${s.mode === "inSpa" ? "In Spa" : "Home Service"}</td>
      <td>${s.type}</td>
      <td>${s.name}</td>
      <td>₦${(s.amount/100).toLocaleString()}</td>
      <td>
        <button class="action-btn edit" data-id="${s.id}"><i class="bi bi-pencil" style="color: teal;"></i></button>
        <button class="action-btn delete" data-id="${s.id}"><i class="bi bi-trash" style="color: #ef4444"></i></button>
      </td>
    `;
    servicesTable.appendChild(tr);
  });

  pageInfo.textContent = `Page ${currentPage} of ${totalPages || 1}`;
  prevPageBtn.disabled = currentPage === 1;
  nextPageBtn.disabled = currentPage === totalPages || totalPages === 0;
}

// PAGINATION BUTTONS
prevPageBtn.addEventListener('click', () => { if (currentPage > 1) { currentPage--; renderServices({ docs: servicesData.map(s => ({ id: s.id, data: () => s })) }); } });
nextPageBtn.addEventListener('click', () => { const totalPages = Math.ceil(servicesData.length / pageSize); if (currentPage < totalPages) { currentPage++; renderServices({ docs: servicesData.map(s => ({ id: s.id, data: () => s })) }); } });

// REAL-TIME DATA
onSnapshot(collection(db, "services"), snapshot => { renderServices(snapshot); });
modeFilter.addEventListener('change', () => { currentPage = 1; renderServices({ docs: servicesData.map(s => ({ id: s.id, data: () => s })) }); });

// ADD / UPDATE SERVICE
serviceForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const id = document.getElementById('serviceId').value;
  const name = document.getElementById('serviceName').value.trim();
  const type = document.getElementById('serviceType').value;
  const mode = document.getElementById('serviceMode').value;
  const amount = Number(document.getElementById('servicePrice').value) * 100;

  if (!name || !type || !mode || !amount) { formStatus.textContent = "Please fill all fields."; formStatus.style.color = "red"; return; }

  try {
    if (id) { await updateDoc(doc(db, "services", id), { name, type, mode, amount }); formStatus.textContent = "Service updated successfully!"; }
    else { await addDoc(collection(db, "services"), { name, type, mode, amount }); formStatus.textContent = "Service added successfully!"; }
    formStatus.style.color = "green"; serviceForm.reset(); document.getElementById('serviceId').value = "";
  } catch (err) { console.error(err); formStatus.textContent = "Error saving service."; formStatus.style.color = "red"; }
});

// EDIT / DELETE
servicesTable.addEventListener('click', (e) => {
  const row = e.target.closest('tr');
  const cells = row ? row.children : null;

  if (e.target.closest('.edit')) {
    document.getElementById('serviceId').value = e.target.dataset.id;
    document.getElementById('serviceName').value = cells[0].textContent;
    document.getElementById('serviceType').value = cells[1].textContent;
    document.getElementById('serviceMode').value = cells[2].textContent === "In Spa" ? "inSpa" : "homeService";
    document.getElementById('servicePrice').value = parseInt(cells[3].textContent.replace(/[₦,]/g, ''), 10);
    formStatus.textContent = "Editing service..."; formStatus.style.color = "#FF69B4";
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  if (e.target.closest('.delete')) {
    const id = e.target.dataset.id;
    if (confirm("Are you sure you want to delete this service?")) deleteDoc(doc(db, "services", id));
  }
});
</script>
</body>
</html>
