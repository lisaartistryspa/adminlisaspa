const bookingsList = document.getElementById('bookingsList');

let currentPage = 1;
const rowsPerPage = 6;
let lastSeenBookingCount = 0;

// Update Summary
function updateSummary(){
  const newCount = allBookings.length - lastSeenBookingCount;
  notifCountEl.textContent = newCount>0 ? newCount:0;
}


// --- Render Bookings with Pagination ---
let filterDateInitialized = false; // track if user has selected a date

function renderBookings() {
  const searchText = searchInput.value.toLowerCase();
  const filterStatus = statusFilter.value;
  const filterDate = dateFilter.value; // empty = no filter
  const sortDir = sortOrder.value;

  bookingsList.innerHTML = '';

  // --- Filter bookings ---
  const filteredBookings = allBookings.filter(({ data }) => {
    const { customerName, email, status, date } = data;

    if (searchText && !`${customerName} ${email}`.toLowerCase().includes(searchText)) return false;
    if (filterStatus && status !== filterStatus) return false;
    if (filterDate && date !== filterDate) return false;

    return true;
  });

  // --- Sort bookings ---
  filteredBookings.sort((a, b) => {
    const dateA = new Date(`${a.data.date}T${a.data.time}`);
    const dateB = new Date(`${b.data.date}T${b.data.time}`);
    return sortDir === 'asc' ? dateA - dateB : dateB - dateA;
  });

  // --- Pagination calculations ---
  const totalPages = Math.ceil(filteredBookings.length / rowsPerPage) || 1;
  if (currentPage > totalPages) currentPage = totalPages;

  const start = (currentPage - 1) * rowsPerPage;
  const end = start + rowsPerPage;
  const pageItems = filteredBookings.slice(start, end);

  // --- Render bookings ---
  pageItems.forEach(({ id, data }, index) => {
    const { customerName, services, date, status, amount, time, mode, address, phone } = data;

    let servicesHTML = "<em>N/A</em>";
    if(Array.isArray(services) && services.length > 0){
      servicesHTML = `<ul class="service-list">${services.map(s => `<li>${s.name}</li>`).join('')}</ul>`;
    }

    const formattedAmount = `₦${(amount / 100 || 0 / 100).toLocaleString()}`;
    const serviceMode = mode === "inSpa" ? `<b>In-Spa</b>` : `<b>Home Service</b>`;
    const serviceAddress = address ? `<small>Address: <b>${address}</b></small>` : '';
    const safeStatus = status || 'pending';

    const div = document.createElement('div');
    div.className = 'booking-info';
    div.innerHTML = `
      <div class="booking-details">
        <div style="display:flex; align-items:center;">
          <input type="checkbox" class="selectBooking" data-id="${id}" style="width:20px; height:20px; border:2px solid #DA70D6;">
          <span style="color:#DA70D6; margin-left:5px;">Select Booking</span>
        </div>
        <br>
        <div>
          <strong>${customerName}</strong><br>
          ${servicesHTML}
          <small>Phone: ${phone}</small><br>
          <small>Amount: <b style="color:#FF00FF">${formattedAmount}</b></small><br>
          <small>Mode: ${serviceMode}</small><br>
          ${serviceAddress}
        </div>
        <div style="display:flex; justify-content:space-between; align-items:center; margin-top:6px;">
          <small>${date} at ${time}</small>
          <div style="display:flex; align-items:center; gap:6px;">
            <button class="editBooking" data-id="${id}" data-date="${date}" data-time="${time}" style="background:#eee;border:none;border-radius:5px;padding:2px 8px;cursor:pointer;">✏️ Edit</button>
            <span class="badge ${safeStatus}">${safeStatus.toUpperCase()}</span>
          </div>
        </div>
      </div>
    `;
    bookingsList.appendChild(div);
    setTimeout(() => div.classList.add('show'), index * 50);
  });

  renderPagination(totalPages);
}

// --- Pagination Renderer ---
function renderPagination(totalPages) {
  paginationContainer.innerHTML = '';

  // Prev button
  const prevBtn = document.createElement('button');
  prevBtn.textContent = 'Prev';
  prevBtn.disabled = currentPage === 1;
  prevBtn.addEventListener('click', () => { currentPage--; renderBookings(); });
  paginationContainer.appendChild(prevBtn);

  // Page buttons
  for (let i = 1; i <= totalPages; i++) {
    const btn = document.createElement('button');
    btn.textContent = i;
    if (i === currentPage) btn.classList.add('active');
    btn.addEventListener('click', () => { currentPage = i; renderBookings(); });
    paginationContainer.appendChild(btn);
  }

  // Next button
  const nextBtn = document.createElement('button');
  nextBtn.textContent = 'Next';
  nextBtn.disabled = currentPage === totalPages;
  nextBtn.addEventListener('click', () => { currentPage++; renderBookings(); });
  paginationContainer.appendChild(nextBtn);

  // Page jump input
  const pageInput = document.createElement('input');
  pageInput.type = 'number';
  pageInput.min = 1;
  pageInput.max = totalPages;
  pageInput.value = currentPage;
  pageInput.style.marginLeft = '5px';
  pageInput.addEventListener('change', () => {
    let val = parseInt(pageInput.value);
    if (val >= 1 && val <= totalPages) {
      currentPage = val;
      renderBookings();
    } else {
      pageInput.value = currentPage;
    }
  });
  paginationContainer.appendChild(pageInput);
}

// --- Initialize Flatpickr for date only ---
let flatpickrDate;
function initFlatpickr() {
  flatpickrDate = flatpickr("#editDate", {
    dateFormat: "Y-m-d",
    minDate: "today",
    disable: [], // dynamically updated
    onChange: async (selectedDates, dateStr) => {
      const currentTime = document.getElementById('editTime').value;
      await populateAvailableTimes(dateStr, currentTime);
    }
  });
}

initFlatpickr();

// --- Fetch fully booked dates from Firestore ---
async function fetchFullyBookedDates() {
  const snapshot = await getDocs(collection(db, 'bookings'));
  const bookings = snapshot.docs.map(doc => doc.data());

  const dateCounts = {};
  bookings.forEach(b => {
    if (b.date) dateCounts[b.date] = (dateCounts[b.date] || 0) + 1;
  });

  // Max slots per day (8:00-22:00, 2-hour gap => 8 slots/day)
  const maxSlots = 6;
  const fullyBookedDates = Object.keys(dateCounts).filter(date => dateCounts[date] >= maxSlots);

  return fullyBookedDates;
}

// --- Populate available times for a selected date with 2-hour buffer ---
async function populateAvailableTimes(selectedDate, currentTime) {
  const editTimeEl = document.getElementById('editTime');
  editTimeEl.innerHTML = ''; // clear previous options

  const snapshot = await getDocs(collection(db, 'bookings'));
  const bookedTimes = snapshot.docs
    .map(doc => doc.data())
    .filter(b => b.date === selectedDate)
    .map(b => b.time);

  const slots = [];
  for (let h = 8; h <= 20; h += 2) { // 2-hour interval
    slots.push(`${h.toString().padStart(2, '0')}:00`);
  }

  // Filter out slots that fall within 2 hours of any booked slot
  const availableSlots = slots.filter(slot => {
    const slotHour = parseInt(slot.split(':')[0]);
    for (let booked of bookedTimes) {
      const bookedHour = parseInt(booked.split(':')[0]);
      if (slotHour >= bookedHour && slotHour < bookedHour + 2) {
        if (slot === currentTime) return true; // allow editing current booking
        return false; // blocked
      }
    }
    return true;
  });

  if (availableSlots.length === 0) {
    const opt = document.createElement('option');
    opt.value = '';
    opt.textContent = 'No available times';
    opt.disabled = true;
    editTimeEl.appendChild(opt);
  } else {
    availableSlots.forEach(slot => {
      const opt = document.createElement('option');
      opt.value = slot;
      opt.textContent = slot;
      if (slot === currentTime) opt.selected = true;
      editTimeEl.appendChild(opt);
    });
  }
}

// --- Update disabled dates dynamically ---
async function updateDisabledDates() {
  const fullyBookedDates = await fetchFullyBookedDates();
  flatpickrDate.set('disable', fullyBookedDates);
}

// Initial load
updateDisabledDates();

// Real-time updates
onSnapshot(collection(db,'bookings'), snapshot => {
  updateDisabledDates();
});

// --- Open modal ---
document.addEventListener('click', async e => {
  if (e.target.classList.contains('editBooking')) {
    const bookingId = e.target.dataset.id;
    const date = e.target.dataset.date;
    const time = e.target.dataset.time;

    document.getElementById('editBookingId').value = bookingId;

    flatpickrDate.setDate(date, true); // set initial date
    await populateAvailableTimes(date, time); // populate times

    document.getElementById('editModal').style.display = 'flex';
  }
});

// --- Cancel modal ---
document.querySelector('.cancelBtn').addEventListener('click', () => {
  document.getElementById('editModal').style.display = 'none';
});

// --- Submit updated booking ---
document.getElementById('editBookingForm').addEventListener('submit', async e => {
  e.preventDefault();
  const bookingId = document.getElementById('editBookingId').value;
  const newDate = document.getElementById('editDate').value;
  const newTime = document.getElementById('editTime').value;

  if (!newTime) {
    alert('Please select an available time ❌');
    return;
  }

  try {
    await updateDoc(doc(db, 'bookings', bookingId), { date: newDate, time: newTime });
    alert('Booking rescheduled successfully ✅');
    document.getElementById('editModal').style.display = 'none';
  } catch(err) {
    console.error(err);
    alert('Failed to reschedule ❌');
  }
});




// Firestore real-time
onSnapshot(collection(db,'bookings'), snapshot=>{
  allBookings = snapshot.docs.map(docSnap=>({id:docSnap.id,data:docSnap.data()}));

  renderBookings();
});

// Filters & Search
searchInput.addEventListener('input', ()=>{ currentPage=1; renderBookings(); });
statusFilter.addEventListener('change', ()=>{ currentPage=1; renderBookings(); });
sortOrder.addEventListener('change', ()=>{ currentPage=1; renderBookings(); });
dateFilter.addEventListener('change', ()=>{ currentPage=1; renderBookings(); });

// ✅ Clear date filter to show all bookings again
clearDateBtn.addEventListener('click', ()=>{
  dateFilter.value = '';
  currentPage = 1;
  renderBookings();
});

// Bulk Actions
selectAllCheckbox.addEventListener('change', ()=>{
  const checked=selectAllCheckbox.checked;
  document.querySelectorAll('.selectBooking').forEach(cb=>cb.checked=checked);
});
applyBulkBtn.addEventListener('click', async ()=>{
  const selectedAction=bulkActionSelect.value;
  if(!selectedAction) return alert('Please select a bulk action.');
  const selectedIds=Array.from(document.querySelectorAll('.selectBooking:checked')).map(cb=>cb.dataset.id);
  if(selectedIds.length===0) return alert('Please select at least one booking.');
  try{
    const updates=selectedIds.map(id=>updateDoc(doc(db,'bookings',id),{status:selectedAction}));
    await Promise.all(updates);
    alert('Bulk update successful.');
  }catch(e){console.error(e); alert('Bulk update failed.');}
});

// Notifications toggle
notifBell.addEventListener('click', ()=>{
  notifDropdown.style.display = notifDropdown.style.display==='block'?'none':'block';
  lastSeenBookingCount = allBookings.length;
  updateSummary();
});

// ✅ Auto-fill calendar with today's date on load
window.addEventListener('DOMContentLoaded', () => {
  const today = new Date().toISOString().split('T')[0];
  dateFilter.value = today;
});

logoutBtn.addEventListener('click', () => {
  // Clear sessionStorage
  sessionStorage.removeItem('adminUser');

  // Redirect to login page
  window.location.replace('index.html');
});
</script>
</body>
</html>
